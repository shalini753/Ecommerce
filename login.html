
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ShopEase</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f8f6;
            color: #252525;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 7%;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            text-decoration: none;
            color: #252525;
        }

        nav a {
            text-decoration: none;
            color: #252525;
            margin-left: 22px;
            font-size: 14px;
        }

        nav a:hover {
            color: #888;
        }

        /* Login Section */
        .login-section {
            min-height: 82vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 42px;
            background: white;
            border: 1px solid #eee;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
        }

        .login-container h1 {
            font-family: Georgia, serif;
            font-size: 34px;
            font-weight: 500;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 32px;
        }

        /* Form */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 9px;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            outline: none;
            font-size: 14px;
            background: #fff;
        }

        .form-group input:focus {
            border-color: #252525;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 65px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            color: #555;
        }

        /* Button */
        .login-btn {
            width: 100%;
            padding: 14px;
            background: #252525;
            color: white;
            border: none;
            font-size: 15px;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #555;
        }

        .signup-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #777;
        }

        .signup-link a {
            color: #252525;
            font-weight: bold;
            text-decoration: underline;
        }

        /* Footer */
        footer {
            background: #252525;
            color: white;
            text-align: center;
            padding: 22px;
            font-size: 13px;
        }

        @media(max-width: 500px) {
            nav {
                padding: 18px 5%;
            }

            nav a {
                margin-left: 10px;
                font-size: 12px;
            }

            .login-container {
                padding: 28px 22px;
            }

            .login-container h1 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav>
        <a href="index.html" class="logo">ShopEase.</a>

        <div>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="signup.html">Sign Up</a>
        </div>
    </nav>

    <!-- Login Section -->
    <section class="login-section">

        <div class="login-container">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your ShopEase account
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword()"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>

            <p class="signup-link">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </div>

    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 ShopEase. All Rights Reserved.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>

    <script>
        function togglePassword() {
            const password = document.getElementById("password");
            const button = document.querySelector(".toggle-password");

            if (password.type === "password") {
                password.type = "text";
                button.textContent = "Hide";
            } else {
                password.type = "password";
                button.textContent = "Show";
            }
        }
    </script>

</body>
</html>
